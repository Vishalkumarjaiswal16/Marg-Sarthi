[project]
name = "marg-sathi"
version = "0.1.0"
description = "Smart Traffic Management System - AI-powered vehicle detection, tracking, and speed estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "PyYAML>=5.4.0",
]

[project.scripts]
marg-sathi = "SIH.main:main"
